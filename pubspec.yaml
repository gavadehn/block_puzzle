name: block_puzzle
description: "A classic cross-platform Block Puzzle game built with Flutter."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  audioplayers: ^6.1.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/image/mikipuzzle.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/image/mikipuzzle.png"
    background_color: "#0D111A"
    theme_color: "#06D6A0"
  windows:
    generate: true
    image_path: "assets/image/mikipuzzle.png"
    icon_size: 48

flutter:
  uses-material-design: true
  assets:
    - assets/sound/
    - assets/soundtrack/
    - assets/image/
