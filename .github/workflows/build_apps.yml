name: Build Multiplatform Apps (iOS & Android)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Cho phép bấm nút Build thủ công bất kỳ lúc nào

jobs:
  # ==========================================
  # 1. BUILD ANDROID APK & APP BUNDLE (.aab)
  # ==========================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Android APK (Release)
        run: flutter build apk --release

      - name: Build Android App Bundle (Release AAB for Google Play)
        run: flutter build appbundle --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: block_puzzle-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Android App Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: block_puzzle-android-aab
          path: build/app/outputs/bundle/release/app-release.aab

  # ==========================================
  # 2. BUILD IOS (.ipa)
  # ==========================================
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build iOS App (Unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r block_puzzle.ipa Payload

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: block_puzzle-ios-ipa
          path: block_puzzle.ipa
